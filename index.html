<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tặng Diễm </title>
    <!-- Thêm font chữ đẹp, uốn lượn lãng mạn cho thiệp -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        script: ['Dancing Script', 'cursive'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3.5s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        glow: {
                            '0%': { filter: 'drop-shadow(0 0 10px rgba(255,255,255,0.4))' },
                            '100%': { filter: 'drop-shadow(0 0 25px rgba(255,255,255,0.8))' }
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="index.css">
</head>

<body class="bg-[#020513] m-0 p-0 w-full h-full overflow-hidden">
    <div id="skyGroup" class="absolute inset-0 z-[1] pointer-events-none"></div>
    <canvas id="starsCanvas" class="absolute inset-0 z-[2]"></canvas>
    <canvas id="terrainCanvas" class="absolute inset-0 z-[3]"></canvas>
    <canvas id="grassCanvas" class="absolute inset-0 z-[4]"></canvas>

    <!-- UI Lớp Tương Tác 8/3 - Tailwind Glassmorphism -->
    <div id="ui-layer"
        class="absolute inset-0 z-[10] pointer-events-none flex flex-col justify-center items-center font-sans text-center">

        <!-- Bước 1: Text đợi chạm lần đầu -->
        <div id="initial-instruction"
            class="animate-pulse-slow text-white text-[1.15rem] font-medium tracking-[1.5px] opacity-90 drop-shadow-[0_0_10px_rgba(255,255,255,0.6)] px-5 transition-opacity duration-1000 ease-in-out">
            Chạm nhẹ vào màn hình nhé...
        </div>

        <!-- Bước 2: Bức thư hiện ra -->
        <div id="envelope-container"
            class="is-hidden flex flex-col items-center justify-center transition-all duration-[800ms] ease-out cursor-pointer hover:scale-105 pointer-events-none">
            <div class="relative animate-float">
                <img src="love-letter_1f48c.png" alt="Phong thư" id="envelope-img"
                    class="relative w-[120px] sm:w-[130px] h-auto animate-glow mb-4 z-10 transition-transform duration-300">
            </div>
            <div id="instruction-text"
                class="text-white text-[1.15rem] font-semibold tracking-[1.5px] opacity-95 drop-shadow-[0_0_10px_rgba(255,255,255,0.6)] px-5 py-2.5 bg-white/10 rounded-full backdrop-blur-md border border-white/20 shadow-[0_4px_15px_rgba(0,0,0,0.3)]">
                Bạn có thư, chạm để mở...
            </div>
        </div>

        <!-- Bước 3: Lời chúc -->
        <div id="message-box"
            class="is-hidden w-[82%] max-w-[420px] -mt-[60px] p-[35px_25px_30px_25px] bg-[#19050f]/40 backdrop-blur-[8px] rounded-[20px] border border-white/10 shadow-[0_15px_40px_rgba(0,0,0,0.5),inset_0_0_15px_rgba(255,255,255,0.05)] transition-all duration-[1800ms] cubic-bezier(0.16, 1, 0.3, 1)">
            <h1 id="msg-title" data-text="Gửi Diễm"
                class="font-script text-[2.4rem] sm:text-[2.8rem] mb-4 leading-tight bg-gradient-to-r from-[#ffdf80] via-[#ffb6c1] to-[#b3d9ff] text-transparent bg-clip-text drop-shadow-[0_2px_20px_rgba(255,180,200,0.25)] min-h-[3.5rem]">
            </h1>
            <p id="msg-content"
                data-text="Mỗi hoàng hôn buông xuống đều đẹp đó nhưng chẳng thể nào rạng rỡ bằng nụ cười của cậu. Chúc cậu ngày 8/3 thật nhiều niềm vui, luôn xinh đẹp "
                class="text-white/95 text-[0.95rem] sm:text-[1.05rem] leading-[1.65] drop-shadow-[0_1px_4px_rgba(0,0,0,0.5)] m-0 min-h-[6rem] sm:min-h-[7rem]">
            </p>
        </div>
    </div>

    <!-- Nút điều khiển nhạc (Đóng băng/Phát) KIÊN QUYẾT TÁCH KHỎI GIAO DIỆN CHE khuất BÊN DƯỚI -->
    <button id="music-toggle"
        class="absolute bottom-8 left-1/2 -translate-x-1/2 z-[50] pointer-events-auto inline-flex items-center gap-2 px-5 py-2.5 bg-white/10 backdrop-blur-md border border-white/20 rounded-full text-white cursor-pointer hover:bg-white/20 transition-all duration-300 shadow-[0_0_15px_rgba(255,255,255,0.2)]">
        <span id="music-icon" class="text-lg">🎵</span>
        <span id="music-text" class="text-sm font-semibold tracking-wider opacity-90">Nhạc nền</span>
    </button>

    <!-- Background Music -->
    <!-- Đổi 'nhac.mp3' thành tên file nhạc thực tế của bạn -->
    <audio id="bg-music" src="obito.mp3" loop preload="auto"></audio>

    <script src="index.js"></script>
</body>

</html>
