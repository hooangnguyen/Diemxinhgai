<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#070615">
    <title></title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <canvas id="scene"></canvas>
    <div class="vignette"></div>
    <div class="fade-in"></div>

    <button id="music-toggle" class="music-btn" aria-label="Bật/tắt nhạc">
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18V5l11-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="17" cy="16" r="3" />
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18V5l11-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="17" cy="16" r="3" />
            <path d="M3 3l18 18" />
        </svg>
    </button>

    <audio id="bg-music" src="obito.mp3" loop preload="auto"></audio>

    <script src="index.js"></script>
</body>

</html>
